[project]
name = "factorysentinel"
version = "0.1.0"
description = "Real-time IoT sensor pipeline: Kafka + Spark Structured Streaming + Airflow + Prometheus/Grafana"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
