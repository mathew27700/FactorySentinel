# FactorySentinel development stack. Copy .env.example to .env, then run `make up`.
name: factorysentinel

x-restart: &restart
  restart: unless-stopped

services:
  kafka:
    image: apache/kafka:4.4.0
    <<: *restart
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  simulator:
    build: ./simulator
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_TOPIC: sensor.raw
      SIM_SPEED: ${SIM_SPEED:-3600}
      SIM_START: ${SIM_START:-2015-07-01}
      SIM_MAX_HOURS: ${SIM_MAX_HOURS:-0}
      TELEMETRY_CSV: /app/data/raw/PdM_telemetry.csv
      FAULT_FILE: /runtime/faults.json
    volumes:
      # The dataset is not in git: run scripts/download_data.sh first.
      - ./data/raw:/app/data/raw:ro
      # scripts/inject_fault.py writes faults.json here; the simulator reads it.
      - ./runtime:/runtime
    depends_on:
      kafka:
        condition: service_healthy

  # The Spark Structured Streaming job. SPARK_MASTER=local[2] runs driver and executors inside
  # this one container; set it to spark://spark-master:7077 to use the "cluster" profile instead.
  streaming:
    build: ./streaming
    <<: *restart
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - ${SPARK_MASTER:-local[2]}
      - --driver-memory
      - 1g
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0
      - --conf
      - spark.jars.ivy=/opt/ivy
      - /opt/factorysentinel/jobs/job.py
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-prefer}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Optional second, cloud endpoint for clean events (Fabric Eventstream or Event Hubs).
      CLOUD_BOOTSTRAP: ${CLOUD_BOOTSTRAP:-}
      CLOUD_TOPIC: ${CLOUD_TOPIC:-}
      CLOUD_SECURITY_PROTOCOL: SASL_SSL
      CLOUD_SASL_PASSWORD: ${CLOUD_SASL_PASSWORD:-}
      CHECKPOINT_PATH: /data/checkpoints
      LAKE_PATH: /data/lake
    ports:
      - "4040:4040"
    volumes:
      - ./streaming/jobs:/opt/factorysentinel/jobs:ro
      - ./data:/data
      - ivy-cache:/opt/ivy
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  spark-master:
    image: apache/spark:4.2.0-scala2.13-java17-python3-ubuntu
    <<: *restart
    profiles: ["cluster"]
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./streaming/jobs:/opt/factorysentinel/jobs:ro

  spark-worker:
    image: apache/spark:4.2.0-scala2.13-java17-python3-ubuntu
    <<: *restart
    profiles: ["cluster"]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    depends_on:
      - spark-master
    volumes:
      - ./streaming/jobs:/opt/factorysentinel/jobs:ro

  postgres:
    image: postgres:18.6
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    configs:
      - source: postgres-init-airflow
        target: /docker-entrypoint-initdb.d/01-airflow-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow:
    image: apache/airflow:3.3.2-python3.11
    <<: *restart
    profiles: ["batch"]
    # Airflow 3.3 opens the passwords file for writing (it locks it while the API server
    # starts), and a mounted config is read-only and owned by root. So start from a copy.
    command:
      - bash
      - -c
      - install -m 0600 /opt/airflow/passwords.seed.json /opt/airflow/passwords.json && exec airflow standalone
    environment:
      # Airflow metadata lives in its own "airflow" database, separate from the project database.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/passwords.json
      # Connection used by the warehouse DAG (conn id: factorysentinel_db).
      AIRFLOW_CONN_FACTORYSENTINEL_DB: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8081:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./warehouse:/opt/airflow/warehouse:ro
      - airflow-logs:/opt/airflow/logs
    configs:
      - source: airflow-passwords
        target: /opt/airflow/passwords.seed.json
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.1
    <<: *restart
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.2.4
    <<: *restart
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Read by provisioning/datasources/datasources.yml.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - postgres

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.11.0
    <<: *restart
    profiles: ["monitoring"]
    command: ["--kafka.server=${KAFKA_BOOTSTRAP}"]
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy

configs:
  postgres-init-airflow:
    content: |
      CREATE DATABASE airflow;
  airflow-passwords:
    content: |
      {"admin": "${AIRFLOW_ADMIN_PASSWORD}"}

volumes:
  kafka-data:
  postgres-data:
  prometheus-data:
  grafana-data:
  airflow-logs:
  ivy-cache:
